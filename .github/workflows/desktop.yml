name: Build NuvioDesktop

on:
  push:
    branches: [Dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Create local.properties (self-hosted backend)
        run: |
          printf '%s\n' \
            'NUVIO_SUPABASE_URL=https://nuviobackend.kissmissi.duckdns.org' \
            'NUVIO_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg5NzY2MDkyLCJleHAiOjE5NDc0NDYwOTJ9.XB5a12DpW9Uf11QARCv4AAfYHGyk4qRq2Oi_7t8t7X0' \
            'NUVIO_SUPABASE_FALLBACK_URL=' \
            'NUVIO_ANDROID_DISTRIBUTION=full' \
            'NUVIO_IOS_DISTRIBUTION=appstore' \
            > local.properties

      - name: Build macOS app bundle
        run: |
          set -o pipefail
          ./gradlew :composeApp:packageReleaseAppImage --stacktrace 2>&1 | tee build-log-macos.txt

      - name: Zip app bundle
        run: |
          APP_PATH=$(find composeApp/build/compose/binaries -type d -name "*.app" | head -1)
          echo "Found: $APP_PATH"
          (cd "$(dirname "$APP_PATH")" && zip -qry "$(basename "$APP_PATH").zip" "$(basename "$APP_PATH")")
          cp "$(dirname "$APP_PATH")/$(basename "$APP_PATH").zip" ./NuvioDesktop-macos.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvioDesktop-macos
          path: NuvioDesktop-macos.zip
          if-no-files-found: error

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-mac-build-${{ github.run_number }}
          name: NuvioDesktop macOS build ${{ github.run_number }}
          prerelease: true
          files: NuvioDesktop-macos.zip

      - name: Attach build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-debug-logs
          name: CI debug logs
          prerelease: true
          files: build-log-macos.txt

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Linux native build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config g++ cmake libmpv-dev libwebkit2gtk-4.1-dev libgtk-3-dev libx11-dev libxcomposite-dev libxext-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Create local.properties (self-hosted backend)
        run: |
          printf '%s\n' \
            'NUVIO_SUPABASE_URL=https://nuviobackend.kissmissi.duckdns.org' \
            'NUVIO_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg5NzY2MDkyLCJleHAiOjE5NDc0NDYwOTJ9.XB5a12DpW9Uf11QARCv4AAfYHGyk4qRq2Oi_7t8t7X0' \
            'NUVIO_SUPABASE_FALLBACK_URL=' \
            'NUVIO_ANDROID_DISTRIBUTION=full' \
            'NUVIO_IOS_DISTRIBUTION=appstore' \
            > local.properties

      - name: Package Linux distribution
        run: |
          set -o pipefail
          ./gradlew :composeApp:packageReleaseDeb --stacktrace 2>&1 | tee build-log-linux.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NuvioDesktop-linux
          path: composeApp/build/compose/binaries/**/*.deb
          if-no-files-found: error

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-linux-build-${{ github.run_number }}
          name: NuvioDesktop Linux build ${{ github.run_number }}
          prerelease: true
          files: composeApp/build/compose/binaries/**/*.deb

      - name: Attach build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-debug-logs
          name: CI debug logs
          prerelease: true
          files: build-log-linux.txt
