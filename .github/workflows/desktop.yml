name: Build NuvioDesktop

on:
  push:
    branches: [Dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Create local.properties (self-hosted backend)
        run: |
          printf '%s\n' \
            'NUVIO_SUPABASE_URL=https://nuviobackend.kissmissi.duckdns.org' \
            'NUVIO_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg5NzY2MDkyLCJleHAiOjE5NDc0NDYwOTJ9.XB5a12DpW9Uf11QARCv4AAfYHGyk4qRq2Oi_7t8t7X0' \
            'NUVIO_SUPABASE_FALLBACK_URL=' \
            'NUVIO_ANDROID_DISTRIBUTION=full' \
            'NUVIO_IOS_DISTRIBUTION=appstore' \
            > local.properties

      - name: Package macOS distribution
        run: |
          set -o pipefail
          ./gradlew :composeApp:packageReleaseDistributionForCurrentOS --stacktrace 2>&1 | tee build-log.txt

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: NuvioDesktop-macos
          path: composeApp/build/compose/binaries/**/dmg/*.dmg
          if-no-files-found: error

      - name: Publish dmg to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-mac-build-${{ github.run_number }}
          name: NuvioDesktop macOS build ${{ github.run_number }}
          prerelease: true
          files: composeApp/build/compose/binaries/**/dmg/*.dmg

      - name: Attach build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-debug-logs
          name: CI debug logs
          prerelease: true
          files: build-log.txt

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Create local.properties (self-hosted backend)
        run: |
          printf '%s\n' \
            'NUVIO_SUPABASE_URL=https://nuviobackend.kissmissi.duckdns.org' \
            'NUVIO_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg5NzY2MDkyLCJleHAiOjE5NDc0NDYwOTJ9.XB5a12DpW9Uf11QARCv4AAfYHGyk4qRq2Oi_7t8t7X0' \
            'NUVIO_SUPABASE_FALLBACK_URL=' \
            'NUVIO_ANDROID_DISTRIBUTION=full' \
            'NUVIO_IOS_DISTRIBUTION=appstore' \
            > local.properties

      - name: Package Linux distribution
        run: |
          set -o pipefail
          ./gradlew :composeApp:packageReleaseDistributionForCurrentOS --stacktrace 2>&1 | tee build-log.txt

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: NuvioDesktop-linux
          path: |
            composeApp/build/compose/binaries/**/*.deb
            composeApp/build/compose/binaries/**/*.AppImage
          if-no-files-found: ignore

      - name: Attach build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-debug-logs
          name: CI debug logs
          prerelease: true
          files: build-log.txt
