name: Test Telegram

on:
  push:
    paths: ['.github/workflows/telegram-test.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send test message (release format with download links)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "SECRETS MISSING: TG_BOT_TOKEN and/or TG_CHAT_ID not set in repo secrets"
            exit 1
          fi
          UP=$(curl -s -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/NuvioMedia/NuvioDesktop/releases/latest | python3 -c "import json,sys;print(json.load(sys.stdin)['tag_name'])")
          MAC_URL="https://github.com/vgupta1192/NuvioDesktop/releases/tag/desktop-mac-${UP}"
          LINUX_URL="https://github.com/vgupta1192/NuvioDesktop/releases/tag/desktop-linux-${UP}"
          for TAG in "desktop-mac-${UP}" "desktop-linux-${UP}"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/vgupta1192/NuvioDesktop/releases/tags/${TAG}")
            echo "release ${TAG} on fork: HTTP ${CODE}"
            if [ "$CODE" != "200" ]; then echo "latest release missing on fork"; exit 1; fi
          done
          MSG="✅ [TEST] 💻 NuvioDesktop ${UP} is ready
          macOS: ${MAC_URL}
          Linux: ${LINUX_URL}
          (open dmg, drag to Applications, then: xattr -cr /Applications/Nuvio.app)"
          curl -fsS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            --data-urlencode "text=${MSG}"
