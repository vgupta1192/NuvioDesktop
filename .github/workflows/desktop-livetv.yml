name: Build NuvioDesktop LiveTV (upstream release sync)

on:
  push:
    branches: [livetv]
    paths: ['.github/**']
  workflow_dispatch:
    # Builds are triggered by the local watcher on vgupta1192's box
    # (~/bin/nuvio-sync-check.sh nuviodesktop-livetv): GitHub's schedule event drops
    # runs for hours, so the old hourly cron never fired reliably. The
    # watcher pushes a sync-pulse commit when upstream has an unbuilt
    # release, which lands here via the push trigger above.

permissions:
  contents: write

# one LiveTV build at a time; separate group so it never races the main desktop.yml run
concurrency:
  group: build-nuviodesktop-livetv
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - name: Check upstream release
        id: ver
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          UP=$(curl -s -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/NuvioMedia/NuvioDesktop/releases/latest | python3 -c "import json,sys;print(json.load(sys.stdin)['tag_name'])")
          VER="${UP%%-*}"
          echo "upstream tag: $UP (version $VER)"
          BUILT=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/vgupta1192/NuvioDesktop/releases/tags/desktop-livetv-mac-$UP")
          # workflow_dispatch or a head commit message containing [force-build] rebuilds
          # even when the release already exists
          FORCE=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then FORCE=true; fi
          if echo "$HEAD_MSG" | grep -qi '\[force-build\]'; then FORCE=true; fi
          SHOULD=true
          if [ "$BUILT" = "200" ] && [ "$FORCE" != "true" ]; then
            RENAMED=$(curl -s -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/vgupta1192/NuvioDesktop/releases/tags/desktop-livetv-mac-$UP" | jq --arg want "NuvioDesktopLiveTV-${VER}-b" '[.assets[] | select(.name | startswith($want))] | length')
            if [ "${RENAMED:-0}" -ge 1 ]; then echo "already built with release naming, skipping"; SHOULD=false; else echo "release exists but assets need renaming, rebuilding"; fi
          fi
          echo "should_build=$SHOULD" >> "$GITHUB_OUTPUT"
          echo "tag=$UP" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.ver.outputs.should_build == 'true'
        with:
          repository: NuvioMedia/NuvioDesktop
          ref: Dev
          lfs: true

      - uses: actions/setup-java@v4
        if: steps.ver.outputs.should_build == 'true'
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/checkout@v4
        if: steps.ver.outputs.should_build == 'true'
        with:
          path: fork-src
          sparse-checkout: .github/patches

      - name: Hide Trakt card (Simkl-only build)
        if: steps.ver.outputs.should_build == 'true'
        run: git apply --3way fork-src/.github/patches/hide-unconfigured-trakt.patch

      - name: Fix upstream broken isGifUrl reference (drop when upstream fixes Dev)
        if: steps.ver.outputs.should_build == 'true'
        run: git apply --3way fork-src/.github/patches/fix-desktop-isgifurl.patch

      # Self-host fork patch: the in-app updater checks this fork's releases and compares the CI
      # run number (version name <ver>-fork.<run>, package NuvioDesktop-<ver>-b<run>.dmg/.deb).
      - name: Apply fork-updater patch
        id: patch_updater
        if: steps.ver.outputs.should_build == 'true'
        run: |
          # plain git apply is all-or-nothing, so a failure leaves the other patches as they are
          if git apply fork-src/.github/patches/fork-updater.patch; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::fork-updater.patch no longer applies to upstream; building without it"
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi

      # Live TV variant: its updater follows only desktop-livetv-* releases (needs fork-updater)
      - name: Apply livetv-updater patch
        if: steps.ver.outputs.should_build == 'true' && steps.patch_updater.outputs.applied == 'true'
        run: git apply fork-src/.github/patches/livetv-updater.patch

      # Live TV feature (desktop port of NuvioTV's livetv branch) and the side-install variant:
      # app NuvioLiveTV / bundle com.nuvio.media.desktop.livetv / own data dir. Both are required:
      # without the variant the package would install over the main Nuvio app.
      - name: Apply livetv-feature and livetv-variant patches
        if: steps.ver.outputs.should_build == 'true'
        run: |
          for P in livetv-feature livetv-variant; do
            if ! git apply "fork-src/.github/patches/$P.patch"; then
              echo "::error::$P.patch no longer applies to upstream Dev"
              exit 1
            fi
          done
          git diff --stat

      - name: Create local.properties (self-hosted backend)
        if: steps.ver.outputs.should_build == 'true'
        run: |
          printf '%s\n' \
            'NUVIO_SUPABASE_URL=https://nuviobackend.kissmissi.duckdns.org' \
            'NUVIO_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg5NzY2MDkyLCJleHAiOjE5NDc0NDYwOTJ9.XB5a12DpW9Uf11QARCv4AAfYHGyk4qRq2Oi_7t8t7X0' \
            'NUVIO_SUPABASE_FALLBACK_URL=' \
            'SIMKL_CLIENT_ID=cf7f2a335cfcd9759fa01d752d9cf8f42fb4fa1a4e4ff08fe4cafb84ec836621' \
            'TMDB_API_KEY=af624aa414c84ad32d55d5ac45feae76' \
            'NUVIO_ANDROID_DISTRIBUTION=full' \
            'NUVIO_IOS_DISTRIBUTION=appstore' \
            > local.properties

      - name: Package macOS dmg
        if: steps.ver.outputs.should_build == 'true'
        env:
          NUVIO_DESKTOP_VERSION_NAME: ${{ steps.ver.outputs.ver }}-fork.${{ github.run_number }}
        run: |
          set -o pipefail
          ./gradlew :composeApp:packageReleaseDmg --no-configuration-cache --stacktrace 2>&1 | tee build-log-macos.txt

      - name: Verify native player libraries inside dmg
        if: steps.ver.outputs.should_build == 'true'
        run: |
          DMG=$(find composeApp/build/compose/binaries -name "*.dmg" | head -1)
          echo "dmg: $DMG"
          test -n "$DMG"
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/nuvio-dmg "$DMG"
          APP=$(find /tmp/nuvio-dmg -maxdepth 2 -name "*.app" | head -1)
          BRIDGE=$(find "$APP" -name "libplayer_bridge.dylib" | head -1)
          MPV=$(find "$APP" -iname "*mpv*" | head -1)
          echo "bridge: $BRIDGE"
          echo "mpv: $MPV"
          hdiutil detach /tmp/nuvio-dmg -force
          test -n "$BRIDGE" || (echo "MISSING libplayer_bridge.dylib" && exit 1)
          test -n "$MPV" || (echo "MISSING libmpv dylib" && exit 1)

      - name: Rename dmg
        if: steps.ver.outputs.should_build == 'true'
        run: |
          DMG=$(find composeApp/build/compose/binaries -name "*.dmg" | head -1)
          cp "$DMG" "NuvioDesktopLiveTV-${{ steps.ver.outputs.ver }}-b${{ github.run_number }}.dmg"
          ls -l NuvioDesktopLiveTV-*.dmg

      - name: Upload dmg
        if: steps.ver.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NuvioDesktopLiveTV-macos
          path: NuvioDesktopLiveTV-${{ steps.ver.outputs.ver }}-b${{ github.run_number }}.dmg
          if-no-files-found: error

      - name: Publish dmg to release
        if: steps.ver.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-livetv-mac-${{ steps.ver.outputs.tag }}
          name: NuvioDesktop LiveTV macOS ${{ steps.ver.outputs.tag }}
          prerelease: true
          files: NuvioDesktopLiveTV-${{ steps.ver.outputs.ver }}-b${{ github.run_number }}.dmg

      - name: Remove legacy-named assets
        if: steps.ver.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: NuvioDesktopLiveTV-${{ steps.ver.outputs.ver }}-b${{ github.run_number }}.dmg
          TAG: desktop-livetv-mac-${{ steps.ver.outputs.tag }}
        run: |
          gh api "repos/${{ github.repository }}/releases/tags/$TAG" \
            | jq -r --arg keep "$KEEP" --argjson run "${{ github.run_number }}" '.assets[]
                | select(.name != $keep)
                | select((((.name | capture("-b(?<n>[0-9]+)\\.(dmg|deb)$") | .n) // "0") | tonumber) < $run)
                | .id' \
            | while read -r id; do
                echo "deleting legacy asset $id"
                gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id"
              done

      - name: Notify Telegram
        if: steps.ver.outputs.should_build == 'true' && env.TG_BOT_TOKEN != '' && env.TG_CHAT_ID != ''
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          REL_TAG: desktop-livetv-mac-${{ steps.ver.outputs.tag }}
          VER: ${{ steps.ver.outputs.tag }}
        run: |
          MSG="📺💻 NuvioDesktop LiveTV macOS ${VER} is ready
          Upstream release: ${VER}
          Download: https://github.com/vgupta1192/NuvioDesktop/releases/tag/${REL_TAG}
          ${{ steps.patch_updater.outputs.applied == 'true' && format('Build {0}: Macs on a fork build show the update banner at start (or Settings → check for updates); Update opens the dmg, drag Nuvio to Applications', github.run_number) || '⚠️ fork-updater patch did NOT apply — manual install only' }}
          Installs alongside the main app as NuvioLiveTV (own login/settings)
          (first manual install: open dmg, drag to Applications, then: xattr -cr /Applications/NuvioLiveTV.app)"
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            --data-urlencode "text=${MSG}" > /dev/null

      - name: Attach build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-livetv-debug-logs
          name: LiveTV CI debug logs
          prerelease: true
          files: build-log-macos.txt

  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream release
        id: ver
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          UP=$(curl -s -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/NuvioMedia/NuvioDesktop/releases/latest | python3 -c "import json,sys;print(json.load(sys.stdin)['tag_name'])")
          VER="${UP%%-*}"
          echo "upstream tag: $UP (version $VER)"
          BUILT=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/vgupta1192/NuvioDesktop/releases/tags/desktop-livetv-linux-$UP")
          # workflow_dispatch or a head commit message containing [force-build] rebuilds
          # even when the release already exists
          FORCE=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then FORCE=true; fi
          if echo "$HEAD_MSG" | grep -qi '\[force-build\]'; then FORCE=true; fi
          SHOULD=true
          if [ "$BUILT" = "200" ] && [ "$FORCE" != "true" ]; then
            RENAMED=$(curl -s -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/vgupta1192/NuvioDesktop/releases/tags/desktop-livetv-linux-$UP" | jq --arg want "NuvioDesktopLiveTV-${VER}-b" '[.assets[] | select(.name | startswith($want))] | length')
            if [ "${RENAMED:-0}" -ge 1 ]; then echo "already built with release naming, skipping"; SHOULD=false; else echo "release exists but assets need renaming, rebuilding"; fi
          fi
          echo "should_build=$SHOULD" >> "$GITHUB_OUTPUT"
          echo "tag=$UP" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.ver.outputs.should_build == 'true'
        with:
          repository: NuvioMedia/NuvioDesktop
          ref: Dev
          lfs: true

      - uses: actions/setup-java@v4
        if: steps.ver.outputs.should_build == 'true'
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Linux native build deps
        if: steps.ver.outputs.should_build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config g++ cmake libmpv-dev libwebkit2gtk-4.1-dev libgtk-3-dev libx11-dev libxcomposite-dev libxext-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - uses: actions/checkout@v4
        if: steps.ver.outputs.should_build == 'true'
        with:
          path: fork-src
          sparse-checkout: .github/patches

      - name: Hide Trakt card (Simkl-only build)
        if: steps.ver.outputs.should_build == 'true'
        run: git apply --3way fork-src/.github/patches/hide-unconfigured-trakt.patch

      - name: Fix upstream broken isGifUrl reference (drop when upstream fixes Dev)
        if: steps.ver.outputs.should_build == 'true'
        run: git apply --3way fork-src/.github/patches/fix-desktop-isgifurl.patch

      # Self-host fork patch: the in-app updater checks this fork's releases and compares the CI
      # run number (version name <ver>-fork.<run>, package NuvioDesktop-<ver>-b<run>.dmg/.deb).
      - name: Apply fork-updater patch
        id: patch_updater
        if: steps.ver.outputs.should_build == 'true'
        run: |
          # plain git apply is all-or-nothing, so a failure leaves the other patches as they are
          if git apply fork-src/.github/patches/fork-updater.patch; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::fork-updater.patch no longer applies to upstream; building without it"
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi

      # Live TV variant: its updater follows only desktop-livetv-* releases (needs fork-updater)
      - name: Apply livetv-updater patch
        if: steps.ver.outputs.should_build == 'true' && steps.patch_updater.outputs.applied == 'true'
        run: git apply fork-src/.github/patches/livetv-updater.patch

      # Live TV feature (desktop port of NuvioTV's livetv branch) and the side-install variant:
      # app NuvioLiveTV / bundle com.nuvio.media.desktop.livetv / own data dir. Both are required:
      # without the variant the package would install over the main Nuvio app.
      - name: Apply livetv-feature and livetv-variant patches
        if: steps.ver.outputs.should_build == 'true'
        run: |
          for P in livetv-feature livetv-variant; do
            if ! git apply "fork-src/.github/patches/$P.patch"; then
              echo "::error::$P.patch no longer applies to upstream Dev"
              exit 1
            fi
          done
          git diff --stat

      - name: Create local.properties (self-hosted backend)
        if: steps.ver.outputs.should_build == 'true'
        run: |
          printf '%s\n' \
            'NUVIO_SUPABASE_URL=https://nuviobackend.kissmissi.duckdns.org' \
            'NUVIO_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg5NzY2MDkyLCJleHAiOjE5NDc0NDYwOTJ9.XB5a12DpW9Uf11QARCv4AAfYHGyk4qRq2Oi_7t8t7X0' \
            'NUVIO_SUPABASE_FALLBACK_URL=' \
            'SIMKL_CLIENT_ID=cf7f2a335cfcd9759fa01d752d9cf8f42fb4fa1a4e4ff08fe4cafb84ec836621' \
            'TMDB_API_KEY=af624aa414c84ad32d55d5ac45feae76' \
            'NUVIO_ANDROID_DISTRIBUTION=full' \
            'NUVIO_IOS_DISTRIBUTION=appstore' \
            > local.properties

      - name: Package Linux deb
        if: steps.ver.outputs.should_build == 'true'
        env:
          NUVIO_DESKTOP_VERSION_NAME: ${{ steps.ver.outputs.ver }}-fork.${{ github.run_number }}
        run: |
          ok=0
          for i in 1 2 3; do
            echo "attempt $i"
            ./gradlew :composeApp:packageReleaseDeb --stacktrace 2>&1 | tee build-log-linux.txt && ok=1 && break
            echo "gradle failed, retrying in 60s (transient repo errors are common)"
            sleep 60
          done
          DEB=$(find composeApp/build/compose/binaries -name "*.deb" | head -1)
          echo "deb: $DEB"
          test -n "$DEB" && cp "$DEB" "./NuvioDesktopLiveTV-${{ steps.ver.outputs.ver }}-b${{ github.run_number }}.deb"

      - name: Upload artifacts
        if: steps.ver.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NuvioDesktopLiveTV-linux
          path: NuvioDesktopLiveTV-${{ steps.ver.outputs.ver }}-b${{ github.run_number }}.deb
          if-no-files-found: error

      - name: Publish to release
        if: steps.ver.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-livetv-linux-${{ steps.ver.outputs.tag }}
          name: NuvioDesktop LiveTV Linux ${{ steps.ver.outputs.tag }}
          prerelease: true
          files: NuvioDesktopLiveTV-${{ steps.ver.outputs.ver }}-b${{ github.run_number }}.deb

      - name: Remove legacy-named assets
        if: steps.ver.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: NuvioDesktopLiveTV-${{ steps.ver.outputs.ver }}-b${{ github.run_number }}.deb
          TAG: desktop-livetv-linux-${{ steps.ver.outputs.tag }}
        run: |
          gh api "repos/${{ github.repository }}/releases/tags/$TAG" \
            | jq -r --arg keep "$KEEP" --argjson run "${{ github.run_number }}" '.assets[]
                | select(.name != $keep)
                | select((((.name | capture("-b(?<n>[0-9]+)\\.(dmg|deb)$") | .n) // "0") | tonumber) < $run)
                | .id' \
            | while read -r id; do
                echo "deleting legacy asset $id"
                gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id"
              done

      - name: Notify Telegram
        if: steps.ver.outputs.should_build == 'true' && env.TG_BOT_TOKEN != '' && env.TG_CHAT_ID != ''
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          REL_TAG: desktop-livetv-linux-${{ steps.ver.outputs.tag }}
          VER: ${{ steps.ver.outputs.tag }}
        run: |
          MSG="📺🐧 NuvioDesktop LiveTV Linux ${VER} is ready
          Installs alongside the main app as package nuviolivetv (own login/settings)
          ${{ steps.patch_updater.outputs.applied == 'true' && format('Build {0}: fork builds update in-app (banner at start)', github.run_number) || '⚠️ fork-updater patch did NOT apply — manual install only' }}
          Download: https://github.com/vgupta1192/NuvioDesktop/releases/tag/${REL_TAG}"
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            --data-urlencode "text=${MSG}" > /dev/null

      - name: Attach build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-livetv-debug-logs
          name: LiveTV CI debug logs
          prerelease: true
          files: build-log-linux.txt
