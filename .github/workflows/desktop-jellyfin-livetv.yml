name: Build NuvioDesktop Jellyfin+LiveTV (upstream release sync)
# sync-pulse: 0.1.33-alpha 2026-10-30T22:30:12Z
# sync-pulse: 0.1.33-alpha 2026-10-30T22:30:12Z
# sync-pulse: 0.1.33-alpha 2026-10-30T22:30:12Z

on:
  push:
    branches: [master]
    paths: ['.github/**']
  workflow_dispatch:
    # Builds are triggered by the local watcher on vgupta1192's box
    # (~/bin/nuvio-sync-check.sh nuviodesktop-jellyfin-livetv): GitHub's schedule event drops
    # runs for hours, so the old hourly cron never fired reliably. The
    # watcher pushes a sync-pulse commit when upstream has an unbuilt
    # release, which lands here via the push trigger above.

# 2026-10-12: re-arm push trigger (no runs fired since 10-08)
permissions:
  contents: write

# one LiveTV build at a time; separate group so it never races the main desktop.yml run
concurrency:
  group: build-nuviodesktop-jellyfin-livetv
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - name: Check upstream release
        id: ver
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Newest non-draft release, prereleases included: /releases/latest skips prereleases,
          # and NuvioTV ships its 1.1.0 betas only as prereleases (2026-10-15).
          REL=$(curl -s -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/NuvioMedia/NuvioDesktop/releases?per_page=10" \
            | python3 -c "import json,sys;r=[x for x in json.load(sys.stdin) if not x.get('draft')];r.sort(key=lambda x:x.get('published_at') or '',reverse=True);print(json.dumps(r[0]))")
          UP=$(printf '%s' "$REL" | python3 -c "import json,sys;print(json.load(sys.stdin)['tag_name'])")
          # attach the upstream release notes so fork releases carry the upstream changelog
          {
            echo 'notes<<GHR_NOTES_EOF_9d41f'
            printf 'Fork CI build of upstream %s.\n\n' "$UP"
            printf '%s' "$REL" | python3 -c "import json,sys;print(json.load(sys.stdin).get('body') or '(no upstream release notes)')"
            echo 'GHR_NOTES_EOF_9d41f'
          } >> "$GITHUB_OUTPUT"
          VER="${UP%%-*}"
          echo "upstream tag: $UP (version $VER)"
          BUILT=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/vgupta1192/NuvioDesktop/releases/tags/desktop-jellyfin-livetv-mac-$UP")
          # workflow_dispatch or a head commit message containing [force-build] rebuilds
          # even when the release already exists
          FORCE=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then FORCE=true; fi
          if echo "$HEAD_MSG" | grep -qi '\[force-build\]'; then FORCE=true; fi
          SHOULD=true
          if [ "$BUILT" = "200" ] && [ "$FORCE" != "true" ]; then
            RENAMED=$(curl -s -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/vgupta1192/NuvioDesktop/releases/tags/desktop-jellyfin-livetv-mac-$UP" | jq --arg want "NuvioJellyfinTV-${VER}-b" '[.assets[] | select(.name | startswith($want))] | length')
            if [ "${RENAMED:-0}" -ge 1 ]; then echo "already built with release naming, skipping"; SHOULD=false; else echo "release exists but assets need renaming, rebuilding"; fi
          fi
          echo "should_build=$SHOULD" >> "$GITHUB_OUTPUT"
          echo "tag=$UP" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.ver.outputs.should_build == 'true'
        with:
          repository: NuvioMedia/NuvioDesktop
          ref: Dev
          lfs: false
        env:
          GIT_LFS_SKIP_SMUDGE: '1'

      # The macOS libmpv runtime (*.dylib) is stored in upstream's Git LFS. When NuvioMedia's
      # LFS budget runs out (2026-10-13: "This repository exceeded its LFS budget"; forks share
      # that budget), copy the same dylibs from this fork's last macOS release instead. Gradle
      # copies them into the new app and the packager signs them again.
      - name: Fetch macOS libmpv runtime (LFS, or last fork build)
        if: steps.ver.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Gradle bundles only the runner's own arch folder (arm64 on macos-latest)
          ARCH_DIR="composeApp/src/desktopMain/native/macos/runtime/$(uname -m)"
          RT="$ARCH_DIR/**"
          if git lfs pull --include "$RT"; then echo "LFS runtime fetched"; exit 0; fi
          echo "::warning::upstream Git LFS unavailable; reusing the libmpv runtime from the last fork macOS build"
          TAG=$(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName' | grep '^desktop-jellyfin-livetv-mac-' | grep -v debug | head -1)
          echo "source release: $TAG"
          test -n "$TAG"
          mkdir -p /tmp/prev && gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.dmg' -D /tmp/prev
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/prev-dmg /tmp/prev/*.dmg
          APP=$(find /tmp/prev-dmg -maxdepth 2 -name "*.app" | head -1)
          MISSING=0
          for F in $(git lfs ls-files -n -I "$RT"); do
            SRC=$(find "$APP" -type f -path "*/native/macos/*" -name "$(basename "$F")" | head -1)
            if [ -n "$SRC" ]; then cp -f "$SRC" "$F"; else echo "missing in previous app: $F"; MISSING=1; fi
          done
          hdiutil detach /tmp/prev-dmg -force
          if [ "$MISSING" != 0 ]; then echo "::error::previous fork build lacks some runtime dylibs"; exit 1; fi
          if grep -rl 'git-lfs.github.com/spec' "$ARCH_DIR"; then echo "::error::LFS pointer files left"; exit 1; fi
          echo "runtime restored from $TAG"

      - uses: actions/setup-java@v4
        if: steps.ver.outputs.should_build == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: actions/checkout@v4
        if: steps.ver.outputs.should_build == 'true'
        with:
          path: fork-src
          sparse-checkout: .github/patches

      - name: Hide Trakt card (Simkl-only build)
        if: steps.ver.outputs.should_build == 'true'
        run: git apply --3way fork-src/.github/patches/hide-unconfigured-trakt.patch

      - name: Fix upstream broken isGifUrl reference (drop when upstream fixes Dev)
        if: steps.ver.outputs.should_build == 'true'
        run: git apply --3way fork-src/.github/patches/fix-desktop-isgifurl.patch

      # Self-host fork patch: the in-app updater checks this fork's releases and compares the CI
      # run number (version name <ver>-fork.<run>, package NuvioDesktop-<ver>-b<run>.dmg/.deb).
      - name: Apply fork-updater patch
        id: patch_updater
        if: steps.ver.outputs.should_build == 'true'
        run: |
          # plain git apply is all-or-nothing, so a failure leaves the other patches as they are
          if git apply fork-src/.github/patches/fork-updater.patch; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::fork-updater.patch no longer applies to upstream; building without it"
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi

      # jellyfin-livetv variant: its updater follows only desktop-jellyfin-livetv-* releases (needs fork-updater)
      - name: Apply jellyfintv-updater patch
        if: steps.ver.outputs.should_build == 'true' && steps.patch_updater.outputs.applied == 'true'
        run: git apply fork-src/.github/patches/jellyfintv-updater.patch

      # Jellyfin+LiveTV combo: the Live TV feature (+ variant + catalog filtering) and the native
      # Jellyfin integration (+ its own side-install variant, app NuvioJellyfinTV /
      # bundle com.nuvio.media.desktop.jellyfin.tv). All are required: without the variant the
      # package would install over another Nuvio app.
      - name: Apply feature and variant patches
        if: steps.ver.outputs.should_build == 'true'
        run: |
          for P in livetv-feature livetv-variant livetv-filtering jellyfin-feature autosync-feature jellyfintv-variant; do
            if ! git apply "fork-src/.github/patches/$P.patch"; then
              echo "::error::$P.patch no longer applies to upstream Dev"
              exit 1
            fi
          done
          git diff --stat

      # Optional ports from DavidVamaiotu's Nuvio*-Reshaped, one patch per feature. They are
      # warning-only: a patch that no longer applies is skipped and the build goes on without it.
      - name: Apply optional Reshaped ports
        if: steps.ver.outputs.should_build == 'true'
        run: |
          # optional-ports
          for P in ttml-framerate custom-stretch jellyfin-subtitles synced-subtitles library-calendar desktop-seek-previews-v2 desktop-native-props desktop-generated-subtitles desktop-audio-sync-hls desktop-synced-chips custom-stretch-continuous custom-stretch-memory; do
            if git apply "fork-src/.github/patches/$P.patch"; then
              echo "applied $P.patch"
            else
              echo "::warning::$P.patch no longer applies to upstream; building without it"
            fi
          done

      # Fork feature (applies on top of the whole chain, mandatory): Jellyfin screen rewrite —
      # cinematic home (hero pager + row per library) + full-screen detail page reusing the
      # app's DetailHero/DetailMetaInfo/DetailCastSection, with media badges and cast photos.
      - name: Apply Jellyfin cinematic UI patch
        if: steps.ver.outputs.should_build == 'true'
        run: |
          if ! git apply fork-src/.github/patches/desktop-jellyfin-cinematic-ui.patch; then
            echo "::error::desktop-jellyfin-cinematic-ui.patch no longer applies to upstream Dev"
            exit 1
          fi

      # Desktop player ports, made against the finished chain above so they apply after the
      # cinematic UI. Optional like the Reshaped ports: a patch that no longer applies is skipped.
      - name: Apply optional Desktop player ports
        if: steps.ver.outputs.should_build == 'true'
        run: |
          # optional-desktop-late
          for P in desktop-youtube-livetv desktop-player-enhance desktop-autosync-parity desktop-playback-fixes desktop-whisper-macos desktop-livetv-iptv-sources desktop-livetv-iptv-settings desktop-netflix-style desktop-livetv-netflix-style desktop-netflix-parity desktop-livetv-custom-stretch; do
            if git apply "fork-src/.github/patches/$P.patch"; then
              echo "applied $P.patch"
            else
              echo "::warning::$P.patch no longer applies to upstream; building without it"
            fi
          done

      # Upstream Dev wired its own native desktop AutoSync coordinator (cafd3fe9); this fork's
      # autosync engine stays the ONLY autosync by design, so the upstream wiring is reverted
      # (patch = reverse of cafd3fe9, resolved to the fork's hand-merged content). Sits here so
      # its context matches the chain order used to generate it. Mandatory: with the wiring left
      # in, the two autosync engines would fight over the subtitle selection.
      - name: Apply upstream autosync wiring off
        if: steps.ver.outputs.should_build == 'true'
        run: |
          if ! git apply fork-src/.github/patches/desktop-upstream-autosync-off.patch; then
            echo "::error::desktop-upstream-autosync-off.patch no longer applies to upstream Dev"
            exit 1
          fi

      # Desktop dx ports: sound presets (dialogue boost / late night), picture enhance shader,
      # remember playback speed + number-key jumps. Optional like the Reshaped ports: a patch
      # that no longer applies is skipped and the build goes on without it.
      - name: Apply optional Desktop dx ports
        if: steps.ver.outputs.should_build == 'true'
        run: |
          # optional-desktop-dx
          for P in desktop-dx-sound-modes desktop-dx-picture-enhance desktop-dx-remember-keys; do
            if git apply "fork-src/.github/patches/$P.patch"; then
              echo "applied $P.patch"
            else
              echo "::warning::$P.patch no longer applies to upstream; building without it"
            fi
          done

      # Batch 2 small ports: subtitle shadow, subtitles start off, sleep timer, skip feedback,
      # stall hint, calendar Monday start, TheIntroDb fallback, OMDb ratings fallback, clear
      # image cache, What's new, DoH + DNS picker, shared ForkPrefs store. Optional: a patch that
      # no longer applies is skipped and the build goes on without it.
      - name: Apply optional Desktop batch 2 ports
        if: steps.ver.outputs.should_build == 'true'
        run: |
          # optional-desktop-batch2
          for P in desktop-fork-prefs desktop-subs-off-shadow desktop-stall-hint desktop-calendar-monday desktop-introdb-fallback desktop-sleep-timer desktop-image-cache-clear desktop-skip-feedback desktop-omdb-fallback desktop-whats-new desktop-doh-dns desktop-batch2-fixes; do
            if git apply "fork-src/.github/patches/$P.patch"; then
              echo "applied $P.patch"
            else
              echo "::warning::$P.patch no longer applies to upstream; building without it"
            fi
          done

      # Batch 3 medium ports: billboard rotation speed, addon backup, episode rating map,
      # watched-titles Show/Dim/Hide, live stream stats, intro + UI sounds, extra home rows
      # (up next tonight / airing this week / finish a series), home video-rows-only filter,
      # watch stats page, profile insights. Optional: a patch that no longer applies is
      # skipped and the build goes on without it.
      - name: Apply optional Desktop batch 3 ports
        if: steps.ver.outputs.should_build == 'true'
        run: |
          # optional-desktop-batch3
          for P in desktop-hero-rotation-speed desktop-addon-backup desktop-rating-map desktop-watched-titles desktop-stream-stats desktop-intro-sounds desktop-home-rows desktop-home-video-rows-only desktop-watch-stats desktop-profile-insights desktop-batch3-fixes; do
            if git apply "fork-src/.github/patches/$P.patch"; then
              echo "applied $P.patch"
            else
              echo "::warning::$P.patch no longer applies to upstream; building without it"
            fi
          done

      # Batch 4 medium ports: private viewing, brand rating colours, stream search +
      # pinned sources on the sources panel, keyboard pointer hiding. Optional: a patch
      # that no longer applies is skipped and the build goes on without it.
      - name: Apply optional Desktop batch 4 ports
        if: steps.ver.outputs.should_build == 'true'
        run: |
          # optional-desktop-batch4
          for P in desktop-private-viewing desktop-private-viewing-toggle desktop-rating-colors desktop-sources-search-pin desktop-keyboard-pointer-hider desktop-filler-guide desktop-batch4-fixes desktop-episode-rating-logos desktop-episode-rating-fixes desktop-second-subtitle; do
            if git apply "fork-src/.github/patches/$P.patch"; then
              echo "applied $P.patch"
            else
              echo "::warning::$P.patch no longer applies to upstream; building without it"
            fi
          done

      # Batch 5 (large ports, one so far): crash log capture + viewer. Optional: a patch
      # that no longer applies is skipped and the build goes on without it.
      - name: Apply optional Desktop batch 5 ports
        if: steps.ver.outputs.should_build == 'true'
        run: |
          # optional-desktop-batch5
          for P in desktop-torbox-offer desktop-nuvio-read-card desktop-episode-rating-fixes desktop-owned-marker desktop-crash-logs desktop-batch5-fixes desktop-features-hub desktop-features-hub-fixes desktop-settings-layout desktop-features-hub-fixes2 desktop-features-consolidate desktop-wetrakr desktop-feedback-3; do
            if git apply "fork-src/.github/patches/$P.patch"; then
              echo "applied $P.patch"
            else
              echo "::warning::$P.patch no longer applies to upstream; building without it"
            fi
          done

      # On-device Whisper for generated subtitles (desktop-whisper-macos.patch): whisper.cpp is built
      # here as static libraries and the patch's Gradle task links them into libwhisper_bridge.dylib.
      # Metal and Accelerate on Apple silicon; the Intel build is best effort (the runner packages
      # only its own architecture). Skipped when the patch did not apply.
      - name: Cache whisper.cpp static libraries
        id: whisper_cache
        if: steps.ver.outputs.should_build == 'true' && hashFiles('composeApp/src/desktopMain/native/macos/whisper/whisper_bridge.cpp') != ''
        uses: actions/cache@v4
        with:
          path: |
            composeApp/src/desktopMain/native/macos/whisper/lib
            composeApp/src/desktopMain/native/macos/whisper/include
          key: whisper-cpp-macos-v1.7.6-r1

      - name: Build whisper.cpp for macOS
        if: steps.ver.outputs.should_build == 'true' && hashFiles('composeApp/src/desktopMain/native/macos/whisper/whisper_bridge.cpp') != '' && steps.whisper_cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          DEST="$PWD/composeApp/src/desktopMain/native/macos/whisper"
          SRC=/tmp/whisper.cpp
          git clone --depth 1 --branch v1.7.6 https://github.com/ggml-org/whisper.cpp "$SRC"
          mkdir -p "$DEST/include" "$DEST/lib"
          cp "$SRC/include/whisper.h" "$SRC"/ggml/include/*.h "$DEST/include/"
          build_arch() {
            ARCH="$1"; shift
            cmake -S "$SRC" -B "/tmp/whisper-build-$ARCH" -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES="$ARCH" -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
              -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_EXAMPLES=OFF -DWHISPER_BUILD_TESTS=OFF \
              -DWHISPER_BUILD_SERVER=OFF -DGGML_NATIVE=OFF -DGGML_BLAS=ON -DGGML_ACCELERATE=ON "$@"
            cmake --build "/tmp/whisper-build-$ARCH" --config Release -j "$(sysctl -n hw.ncpu)"
            mkdir -p "$DEST/lib/$ARCH"
            # one archive per architecture so the bridge links a single file
            libtool -static -o "$DEST/lib/$ARCH/libwhisper_all.a" $(find "/tmp/whisper-build-$ARCH" -name '*.a')
            ls -l "$DEST/lib/$ARCH/libwhisper_all.a"
          }
          build_arch arm64 -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON
          if ! build_arch x86_64 -DGGML_METAL=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON; then
            echo "::warning::x86_64 whisper.cpp build failed; the Intel Mac build goes without on-device Whisper"
            rm -rf "$DEST/lib/x86_64"
          fi

      - name: Create local.properties (self-hosted backend)
        if: steps.ver.outputs.should_build == 'true'
        run: |
          printf '%s\n' \
            'NUVIO_SUPABASE_URL=https://nuviobackend.kissmissi.duckdns.org' \
            'NUVIO_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg5NzY2MDkyLCJleHAiOjE5NDc0NDYwOTJ9.XB5a12DpW9Uf11QARCv4AAfYHGyk4qRq2Oi_7t8t7X0' \
            'NUVIO_SUPABASE_FALLBACK_URL=' \
            'SIMKL_CLIENT_ID=cf7f2a335cfcd9759fa01d752d9cf8f42fb4fa1a4e4ff08fe4cafb84ec836621' \
            'MDBLIST_CLIENT_ID=37RRuqIIBQbBsHmxcdl3RGRMhrpTK8FdFxAGltS0' \
            'TMDB_API_KEY=af624aa414c84ad32d55d5ac45feae76' \
            'NUVIO_ANDROID_DISTRIBUTION=full' \
            'NUVIO_IOS_DISTRIBUTION=appstore' \
            > local.properties

      - name: Package macOS dmg
        if: steps.ver.outputs.should_build == 'true'
        env:
          NUVIO_DESKTOP_VERSION_NAME: ${{ steps.ver.outputs.ver }}-fork.${{ github.run_number }}
        run: |
          set -o pipefail
          ./gradlew :composeApp:packageReleaseDmg --no-configuration-cache --stacktrace 2>&1 | tee build-log-macos.txt

      # Kotlin compile errors are not visible in check annotations (unlike the TV fork),
      # and the ci-debug-logs asset can lag; surface them directly so a failing build
      # is diagnosable from the anonymous annotations API.
      - name: Surface Kotlin compile errors
        if: failure()
        run: |
          grep -h "^e: " build-log-macos.txt 2>/dev/null | head -40 | while IFS= read -r line; do
            echo "::error::${line#e: }"
          done
          grep -h " error: \|ld: " build-log-macos.txt 2>/dev/null | head -20 | while IFS= read -r line; do
            echo "::error::$line"
          done
          grep -h "Caused by:\|Unresolved reference" build-log-macos.txt 2>/dev/null | head -10 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Verify native player libraries inside dmg
        if: steps.ver.outputs.should_build == 'true'
        run: |
          DMG=$(find composeApp/build/compose/binaries -name "*.dmg" | head -1)
          echo "dmg: $DMG"
          test -n "$DMG"
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/nuvio-dmg "$DMG"
          APP=$(find /tmp/nuvio-dmg -maxdepth 2 -name "*.app" | head -1)
          BRIDGE=$(find "$APP" -name "libplayer_bridge.dylib" | head -1)
          MPV=$(find "$APP" -iname "*mpv*" | head -1)
          echo "bridge: $BRIDGE"
          echo "mpv: $MPV"
          WHISPER=$(find "$APP" -name "libwhisper_bridge.dylib" | head -1)
          echo "whisper bridge: $WHISPER"
          if [ -f composeApp/src/desktopMain/native/macos/whisper/whisper_bridge.cpp ]; then
            test -n "$WHISPER" || (hdiutil detach /tmp/nuvio-dmg -force; echo "MISSING libwhisper_bridge.dylib" && exit 1)
            otool -L "$WHISPER"
          fi
          hdiutil detach /tmp/nuvio-dmg -force
          test -n "$BRIDGE" || (echo "MISSING libplayer_bridge.dylib" && exit 1)
          test -n "$MPV" || (echo "MISSING libmpv dylib" && exit 1)

      - name: Rename dmg
        if: steps.ver.outputs.should_build == 'true'
        run: |
          DMG=$(find composeApp/build/compose/binaries -name "*.dmg" | head -1)
          cp "$DMG" "NuvioJellyfinTV-${{ steps.ver.outputs.ver }}-b${{ github.run_number }}.dmg"
          ls -l NuvioJellyfinTV-*.dmg

      - name: Upload dmg
        if: steps.ver.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NuvioJellyfinTV-macos
          path: NuvioJellyfinTV-${{ steps.ver.outputs.ver }}-b${{ github.run_number }}.dmg
          if-no-files-found: error

      - name: Publish dmg to release
        if: steps.ver.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-jellyfin-livetv-mac-${{ steps.ver.outputs.tag }}
          name: NuvioDesktop Jellyfin+LiveTV macOS ${{ steps.ver.outputs.tag }}
          prerelease: true
          body: ${{ steps.ver.outputs.notes }}
          files: NuvioJellyfinTV-${{ steps.ver.outputs.ver }}-b${{ github.run_number }}.dmg

      - name: Remove legacy-named assets
        if: steps.ver.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: NuvioJellyfinTV-${{ steps.ver.outputs.ver }}-b${{ github.run_number }}.dmg
          TAG: desktop-jellyfin-livetv-mac-${{ steps.ver.outputs.tag }}
        run: |
          gh api "repos/${{ github.repository }}/releases/tags/$TAG" \
            | jq -r --arg keep "$KEEP" --argjson run "${{ github.run_number }}" '.assets[]
                | select(.name != $keep)
                | select((((.name | capture("-b(?<n>[0-9]+)\\.(dmg|deb)$") | .n) // "0") | tonumber) < $run)
                | .id' \
            | while read -r id; do
                echo "deleting legacy asset $id"
                gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id"
              done

      - name: Notify Telegram
        if: steps.ver.outputs.should_build == 'true' && env.TG_BOT_TOKEN != '' && env.TG_CHAT_ID != ''
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          REL_TAG: desktop-jellyfin-livetv-mac-${{ steps.ver.outputs.tag }}
          VER: ${{ steps.ver.outputs.tag }}
        run: |
          HASH=""
          for f in *.dmg *.deb; do
            [ -e "$f" ] || continue
            HASH="${HASH}$(basename "$f"): $(stat -c%s "$f") bytes, sha256 $(sha256sum "$f" | cut -c1-16)..."
          done
          MSG="📺💻 NuvioDesktop Jellyfin+LiveTV macOS ${VER} is ready
          Upstream release: ${VER}
          ${HASH}
          Download: https://github.com/vgupta1192/NuvioDesktop/releases/tag/${REL_TAG}
          ${{ steps.patch_updater.outputs.applied == 'true' && format('Build {0}: Macs on a fork build show the update banner at start (or Settings → check for updates); Update opens the dmg, drag Nuvio to Applications', github.run_number) || '⚠️ fork-updater patch did NOT apply — manual install only' }}
          Installs as Nuvio (own login/settings; Live TV + Jellyfin)
          (first manual install: open dmg, drag to Applications, then: xattr -cr /Applications/Nuvio.app)"
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            --data-urlencode "text=${MSG}" > /dev/null

      - name: Attach build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-jellyfin-livetv-debug-logs
          name: Jellyfin+LiveTV CI debug logs
          prerelease: true
          files: build-log-macos.txt
